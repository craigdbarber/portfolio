<svg viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#30363d" />
    </marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#58a6ff" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="400" rx="12" fill="#0d1117" />
  
  <!-- Group: Build Environment -->
  <rect x="20" y="60" width="300" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <text x="40" y="90" fill="#8b949e" font-family="sans-serif" font-size="14" font-weight="bold">BUILD ENVIRONMENT</text>

  <!-- Component: Jenkins Pipeline -->
  <rect x="50" y="120" width="240" height="60" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="170" y="155" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="12">Jenkins CI Pipeline</text>

  <!-- Component: GKE Plugin -->
  <rect x="50" y="240" width="240" height="80" rx="4" fill="#0d1117" stroke="#58a6ff" />
  <text x="170" y="275" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="bold">GKE Plugin</text>
  <text x="170" y="295" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">K8s Deployment Orchestrator</text>

  <!-- Group: Google Cloud Platform -->
  <rect x="360" y="60" width="420" height="320" rx="8" fill="#161b22" stroke="#30363d" stroke-width="2" />
  <text x="380" y="90" fill="#8b949e" font-family="sans-serif" font-size="14" font-weight="bold">GOOGLE CLOUD PLATFORM</text>

  <!-- Component: IAM / OAuth -->
  <rect x="420" y="110" width="140" height="50" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="490" y="140" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="12">IAM &amp; OAuth 2.0</text>

  <!-- Component: Artifact Registry -->
  <rect x="620" y="110" width="130" height="50" rx="4" fill="#0d1117" stroke="#30363d" />
  <text x="685" y="140" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="12">Artifact Registry</text>

  <!-- Component: GKE Cluster -->
  <rect x="420" y="230" width="330" height="110" rx="4" fill="#0d1117" stroke="#58a6ff" stroke-width="2" />
  <text x="585" y="260" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="14" font-weight="bold">Google Kubernetes Engine (GKE)</text>
  
  <!-- Sub-components in GKE -->
  <rect x="440" y="280" width="90" height="40" rx="2" fill="#238636" fill-opacity="0.1" stroke="#238636" />
  <text x="485" y="305" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10">Deployment</text>
  
  <rect x="540" y="280" width="90" height="40" rx="2" fill="#238636" fill-opacity="0.1" stroke="#238636" />
  <text x="585" y="305" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10">Service</text>

  <rect x="640" y="280" width="90" height="40" rx="2" fill="#238636" fill-opacity="0.1" stroke="#238636" />
  <text x="685" y="305" text-anchor="middle" fill="#f0f6fc" font-family="sans-serif" font-size="10">Ingress</text>

  <!-- Arrows -->
  <!-- Pipeline to Plugin -->
  <path d="M170,180 L170,240" stroke="#30363d" stroke-width="2" marker-end="url(#arrow-gray)" />
  
  <!-- Plugin to IAM (Auth) -->
  <path d="M290,260 L350,260 L350,135 L420,135" fill="none" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" />
  
  <!-- Plugin to GKE (Deploy) -->
  <path d="M290,300 L420,300" stroke="#58a6ff" stroke-width="2" marker-end="url(#arrow-blue)" />
  
  <!-- GKE to Registry (Pull) -->
  <path d="M685,230 L685,160" stroke="#30363d" stroke-width="2" stroke-dasharray="4" marker-end="url(#arrow-gray)" />

  <!-- Legend/Labels -->
  <text x="350" y="250" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">1. Authenticate</text>
  <text x="355" y="315" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">2. Orchestrate</text>
  <text x="735" y="195" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="10">3. Pull Image</text>
</svg>
